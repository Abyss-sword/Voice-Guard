name: ci

on:
  push:
    branches: [master, "codex/*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  syntax:
    name: 语法编译检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: compileall
        run: |
          python -m compileall -q vguard scripts tools frontend platform tests deploy

  unit-light:
    name: 轻量单元测试（无需模型权重）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps (CPU torch + 音频栈)
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy soundfile librosa pyyaml tqdm
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchaudio==2.5.1
      - name: tests
        run: |
          python tests/test_features.py
          python tests/test_masking.py
      - name: 项目结构自检（不依赖权重）
        run: python tools/acceptance_check.py --no-weights --no-services --no-tests
