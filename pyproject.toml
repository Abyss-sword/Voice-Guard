[project]
name = "voice-guard"
version = "1.1.0"
description = "Voice Guard (IJCAI 2023) 复现与探索：时域对抗扰动 + 心理声学掩蔽 + 可运行系统"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
# 不检查第三方参考实现、数据、权重与产物目录
extend-exclude = ["third_party", "outputs", "refs", "data", "checkpoints", ".venv", "docs/history"]

[tool.ruff.lint]
# 基线规则：语法错误、未定义名、未使用导入/变量、重复导入等"真问题"
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E402",  # 脚本必须在 sys.path.insert 之后导入本地包
    "E701",  # 本项目允许紧凑的一行分支（风格选择）
    "E702",  # 同上
    "E731",  # 允许 lambda 赋值（回调）
    "E741",  # 允许 l/I 等单字母变量（频谱/长度等数学约定）
]

[tool.ruff.lint.per-file-ignores]
# 测试与脚本里允许 assert、私有访问等
"tests/*" = ["S101", "F841"]
"scripts/*" = ["F841"]
"tools/*" = ["F841"]
