services:
  voiceguard:
    image: voiceguard:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    init: true
    restart: unless-stopped
    gpus: all
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      VG_DEVICE: cuda
    volumes:
      - ../checkpoints:/app/checkpoints:ro
      - ../data:/app/data:ro
      - ../outputs:/app/outputs
